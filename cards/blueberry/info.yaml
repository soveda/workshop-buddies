draft: true
Name: Workshop Blueberry
short-description: First-pass Blueberry-inspired quantised 4 Voltages keyboard recorder.
summary: >-
  A first-pass monophonic Workshop Computer control card inspired by Blueberry.
  It turns one 4 Voltages output into a quantised keyboard, records held
  phrases, and replays them freely or from Pulse In 1 clock.
Language: C++ (Pico SDK / ComputerCard 0.4.0)
Creator: Adrian Vos
Version: "0.1.0"
Status: Experimental
License: MIT
date-created: 2026-09-24
date-updated: 2026-09-24
repository: https://github.com/soveda/workshop-buddies
contact:
  social:
    github: https://github.com/soveda
tags:
  - sequencer
  - quantizer
  - cv
  - performance
panel:
  inputs:
    - id: AudioIn1
      name: 4 Voltages Keyboard
      type: cv
      description: One output from 4 Voltages; learned as a resting voltage after reset and quantised to pitch.
    - id: PulseIn1
      name: Clock
      type: pulse
      description: Advances one recorded event per rising edge during loop playback.
  outputs:
    - id: CVOut1
      name: Quantised Pitch
      type: cv
      description: Calibrated pitch CV from the live keyboard or recorded loop.
    - id: PulseOut1
      name: Gate
      type: pulse
      description: High for an active live or recorded note.
    - id: PulseOut2
      name: Loop Start
      type: pulse
      description: Short pulse at loop restart.
controls:
  switch:
    up:
      name: Play Loop
      description: Plays the captured phrase.
    middle:
      name: Free Play
      description: Plays the live 4 Voltages input.
    down:
      name: Hold To Record
      description: Records quantised pitch and gate events for the duration held.
  knobs:
    - main:
        name: Transpose Notches
        description: Cross 3 o'clock or 9 o'clock and return through centre for Blueberry-style fifth/octave transposition steps.
  leds:
    - display: list
      items:
        - id: LED0
          name: Input Calibration
          description: Lit when calibrated Audio In conversion is available.
        - id: LED1
          name: Loop Playback
          description: Lit while a recorded loop is playing in Switch Up.
        - id: LED2
          name: Recording
          description: Lit while Switch Down is held and a phrase is captured.
        - id: LED3
          name: Clock Patched
          description: Lit when Pulse In 1 is connected.
        - id: LED4
          name: Gate
          description: Lit while the live or recorded note gate is high.
        - id: LED5
          name: Pitch
          description: Brightness represents current quantised pitch.
uf2:
  - path: uf2/workshop_blueberry_0.1.0.uf2
    name: Workshop Blueberry 0.1.0 First Pass
